name: Android CI

on:
push:
branches: ["main"]
pull_request:
branches: ["main"]

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Configure Firebase
    run: |
      cat > local.properties <<'EOF'
      sdk.dir=$ANDROID_HOME
      FIREBASE_API_KEY=AIzaSyCv7JN3BQFnmHLV4hd2Uv6si4o9Euo78u4
      FIREBASE_APP_ID=1:527487551660:android:7ecbf5e5680c05097a3709
      FIREBASE_PROJECT_ID=vital-core-d5c30
      FIREBASE_STORAGE_BUCKET=vital-core-d5c30.firebasestorage.app
      GOOGLE_WEB_CLIENT_ID=527487551660-u6hcbjbks3tp030kkm5ghh895b2e6mpt.apps.googleusercontent.com
      EOF

  - name: Grant execute permission for gradlew
    run: chmod +x gradlew

  - name: Lint
    run: ./gradlew lint --stacktrace

  - name: Unit tests
    run: ./gradlew testDebugUnitTest --stacktrace

  - name: Assemble debug APK
    run: ./gradlew assembleDebug --stacktrace

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: vitalcore-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk

  - name: Upload lint report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: lint-report
      path: app/build/reports/lint-results-debug.html

  - name: Upload test results
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: unit-test-results
      path: app/build/reports/tests/testDebugUnitTest
```
